name: discord-conversations
version: 1.0.0
manifest_version: 2
description: Literal guild mention admission and durable recent-window shared channel conversations.
author: Team Sneakymouse
kind: standalone
provides_hooks:
  - gateway_message_admission
  - gateway_session_route
  - gateway_delivery_receipt
  - on_session_reset
config_schema:
  require_inline_mention:
    type: bool
    default: true
  recent_channel_sessions:
    type: bool
    default: true
